name: Populate Machi Cache

# /machi/[ward]/[town]（3,142ページ）を全件ビルドしてRemote R2の
# incremental cacheへ書き込む。
#
# ビルドID（next.config.mjs の generateBuildId）を固定してあるので、
# ここで書いたキャッシュは通常デプロイをまたいでそのまま生き続ける。
# ただしその分、クライアント側コードを変えるデプロイをすると、R2に
# 残っている旧ビルド分のページが「もう存在しないJSチャンクを参照する」
# 状態になり、ユーザーが古いキャッシュを引いた瞬間だけ壊れて見える
# （実際に本番で発生：https://sumipita.com/machi/itabashi/misono-1）。
# そのため Deploy ワークフロー成功後に自動でも実行する。
# データ更新（seed/data.sqlの更新→load-data.yml）の後は push を伴わないので
# 自動起動されず、引き続き手動実行が必要。
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  populate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Populate Machi Cache
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Seed local D1 for build
        # ビルド中に /machi/[ward]/[town] の全件をD1に問い合わせて生成するため、
        # ここだけの使い捨てローカルD1にseed/data.sqlを流し込んでおく
        # （本番Remote D1には触れない）。
        run: |
          npx wrangler d1 execute sumipita --local --file=migrations/0001_init.sql
          npx wrangler d1 execute sumipita --local --file=seed/data.sql
      - name: Build with full machi SSG
        run: npx opennextjs-cloudflare build
        env:
          POPULATE_MACHI_CACHE: "1"
      - name: Populate remote R2 cache
        run: npx opennextjs-cloudflare populateCache remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
