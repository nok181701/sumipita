name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check data
        # web/public/data/ が欠けたままビルドしても、エラーは出ずに
        # 地図が真っ白のサイトが公開されてしまう
        run: |
          set -e
          test -f public/data/index.json
          test "$(ls public/data/wards/*.json | wc -l)" -eq 23
          test "$(ls public/data/geojson/*.geojson | wc -l)" -eq 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx opennextjs-cloudflare build
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
