name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check assets
        # ポリゴンが欠けたままビルドしても、エラーは出ずに地図が真っ白のサイトが公開される
        run: test "$(ls public/data/geojson/*.geojson | wc -l)" -eq 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Seed local D1 for build
        # /machi/[ward]（23件）・/machi/[ward]/[town]（3,142件）の全件事前生成のため、
        # ビルド中にD1へ問い合わせられるよう、ここだけの使い捨てローカルD1に
        # seed/data.sqlを流し込む（本番Remote D1には触れない）。
        run: |
          npx wrangler d1 execute sumipita --local --file=migrations/0001_init.sql
          npx wrangler d1 execute sumipita --local --file=seed/data.sql
      - name: Build
        # PRERENDER_ALL_MACHI=1で全件事前生成する。このあとの Populate remote R2 cache と
        # Deploy は同じビルド成果物を使うので、R2に置くHTMLとWorkerが配信するJSチャンクは
        # 必ず一致する（過去に生成用ビルドとデプロイ用ビルドが別物だったことで
        # チャンク不一致が起きた経緯があるので、分離しないこと）。
        run: npx opennextjs-cloudflare build
        env:
          PRERENDER_ALL_MACHI: "1"
      - name: Populate remote R2 cache
        run: npx opennextjs-cloudflare populateCache remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        # 適用済みかどうかはD1側の d1_migrations テーブルが持っているので、
        # 毎回実行しても未適用のものだけが流れる。
        # データ（3,142行）はここでは入れない。スコアを再計算したときだけ
        # ローカルから seed.sql を流す。詳細はREADMEの「データを更新する」参照。
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: d1 migrations apply sumipita --remote
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
