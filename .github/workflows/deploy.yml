name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check assets
        # ポリゴンが欠けたままビルドしても、エラーは出ずに地図が真っ白のサイトが公開される
        run: test "$(ls public/data/geojson/*.geojson | wc -l)" -eq 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Seed local D1 for build
        # /machi/[ward]/[town] を generateStaticParams でビルド時に静的出力するため、
        # ビルド中にD1を問い合わせる（本番Remote D1には繋がらないので、ここだけの
        # 使い捨てローカルD1にseed/data.sqlを流し込んでおく）。
        run: |
          npx wrangler d1 execute sumipita --local --file=migrations/0001_init.sql
          npx wrangler d1 execute sumipita --local --file=seed/data.sql
      - name: Build
        run: npx opennextjs-cloudflare build
      - name: Apply D1 migrations
        # 適用済みかどうかはD1側の d1_migrations テーブルが持っているので、
        # 毎回実行しても未適用のものだけが流れる。
        # データ（3,142行）はここでは入れない。スコアを再計算したときだけ
        # ローカルから seed.sql を流す。詳細はREADMEの「データを更新する」参照。
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: d1 migrations apply sumipita --remote
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
