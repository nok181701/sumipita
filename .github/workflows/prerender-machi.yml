name: Prerender Machi Pages

# /machi/[ward]（23件）・/machi/[ward]/[town]（3,142件）を全件事前生成し、
# そのビルド成果物でR2キャッシュの書き込みとwrangler deployの両方を行う。
#
# 「事前生成に使ったビルド」と「実際に配信するビルド」を必ず一致させるため、
# このワークフロー自身がデプロイまで行う。populateCache remoteだけしてdeployを
# 省略すると、R2に書き込んだHTMLが参照するJSチャンクと、実際にWorkerが配信する
# チャンクが一致しなくなり、本番でクライアント側エラー（ChunkLoadError）が起きる
# （過去に実際に発生した不具合。詳細はgit履歴参照）。
#
# 毎回のpushでは実行しない（3,165ページの生成に数分かかり、通常のデプロイを
# 遅くしたくないため）。データ更新（load-data.yml）の後、または全件を作り直したい
# ときに手動実行する。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prerender:
    runs-on: ubuntu-latest
    name: Prerender Machi Pages
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Seed local D1 for build
        # 3,165ページぶんD1へ問い合わせられるよう、ここだけの使い捨てローカルD1に
        # seed/data.sqlを流し込む（本番Remote D1には触れない）。
        run: |
          npx wrangler d1 execute sumipita --local --file=migrations/0001_init.sql
          npx wrangler d1 execute sumipita --local --file=seed/data.sql
      - name: Build (prerender all machi pages)
        run: npx opennextjs-cloudflare build
        env:
          PRERENDER_ALL_MACHI: "1"
      - name: Populate remote R2 cache
        run: npx opennextjs-cloudflare populateCache remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: d1 migrations apply sumipita --remote
      - name: Deploy
        # このステップが本質。上で書き込んだR2キャッシュのbuildIdと、実際に配信される
        # buildIdを一致させる。
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
